[package]
name = "kcpp_parrot"
version = "0.1.0"
edition = "2021"
description = "C ABI shim exposing Parrot's Kokoro TTS engine (tts-rs) to koboldcpp"
license = "MIT"
publish = false

# Built only when koboldcpp is configured with KCPP_PARROT=1 (make) or -DKCPP_PARROT=ON (cmake).
# Engine: tts-rs, the inference crate behind https://github.com/rishiskhare/parrot
# (pinned to the version Parrot 26.2.4 ships).

[lib]
name = "kcpp_parrot"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
tts-rs = { version = "=2026.2.3", features = ["kokoro"] }
# tts-rs declares ort = "2.0.0-rc.10", which semver-resolves to newer rcs with breaking
# API changes (rc.13 fails to compile). Pin to what Parrot 26.2.4's Cargo.lock uses.
ort = { version = "=2.0.0-rc.11", default-features = false }
ort-sys = { version = "=2.0.0-rc.11", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "unwind"
