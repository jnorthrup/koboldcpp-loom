name: Koboldcpp-LOOM Linux CUDA13 + Parrot

# LOOM build: upstream CUDA13 recipe plus the optional Parrot (Kokoro ONNX via tts-rs)
# TTS backend. Native SASS/PTX for Turing..Blackwell via LLAMA_ARCHES_CU13.
# Output is a hash-pinnable runtime file; no image is published.

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''

env:
  KCPP_CUDA: 13.0.0
  ARCHES_CU13: 1
  KCPP_PARROT: 1
  KCPP_APPEND: -parrot
  KCPP_JOBS: 12
  LOOM_SASS: 86 120
  LOOM_NVCC_THREADS: 0

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: ubuntu:20.04
    steps:
      - name: Clone
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.ref_name }}

      - name: Dependencies
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          apt-get -y install git curl bzip2 python3-tk tcl tk build-essential ca-certificates pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set Tcl/Tk Paths
        run: |
          echo "TCL_LIBRARY=$(find /usr/lib/ -name 'tcl8*' | head -n 1)" >> $GITHUB_ENV
          echo "TK_LIBRARY=$(find /usr/lib/ -name 'tk8*' | head -n 1)" >> $GITHUB_ENV

      - name: Build Parrot shim
        run: |
          cd otherarch/parrot && cargo build --release --locked
          ls -la target/release/libkcpp_parrot.a

      - name: Build
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo; free -g | head -2
          (while sleep 60; do echo "LOAD $(cut -d' ' -f1-3 /proc/loadavg) MEMAVAIL_MB $(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)"; done) &
          ./koboldcpp.sh dist
          cd dist && for f in koboldcpp-linux-x64*; do sha256sum "$f"; stat -c '%n %s' "$f"; done

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: koboldcpp-loom-linux-x64-cuda1300-parrot
          path: dist/

  # Hash-pinned home for the runtime: a GitHub release asset on this public
  # repo (free storage and egress, fast from GPU pods). Consumers pin sha256.
  release:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: koboldcpp-loom-linux-x64-cuda1300-parrot
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.sha }}
        run: |
          cd dist
          sha256sum koboldcpp-linux-x64* | tee SHA256SUMS
          tag="loom-cu13-parrot-${SHA:0:9}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$tag" --notes "CUDA 13.0 + Parrot runtime from ${SHA}. Needs driver >= 580 (CUDA 13.0) and glibc >= 2.31." \
            koboldcpp-linux-x64* SHA256SUMS
